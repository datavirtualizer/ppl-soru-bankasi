<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PPL Çalışma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">

<style>
:root{
  --paper:#F2F4F7; --surface:#FFFFFF; --surface-2:#F6F8FA; --surface-3:#E9EEF3;
  --ink:#10151C; --ink-2:#4A5563; --ink-3:#7B8794;
  --rule:#D6DDE5; --rule-2:#B4BFCB;
  --accent:#C21A6B; --accent-soft:#FBE7F0; --accent-ink:#8E0F4C; --on-accent:#FFFFFF;
  --cyan:#0B6E7F; --cyan-soft:#E1F1F4;
  --due:#A8620A; --due-soft:#FBF0DE;
  --ok:#15764F; --ok-soft:#E2F3EB; --bad:#B32318; --bad-soft:#FBE9E7;
  --shadow:0 1px 2px rgba(16,21,28,.05), 0 12px 32px -18px rgba(16,21,28,.30);
  --f-ui:'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-read:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --f-num:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#080B10; --surface:#111721; --surface-2:#171F2A; --surface-3:#1F2937;
    --ink:#E6ECF3; --ink-2:#9AA7B5; --ink-3:#6B7785;
    --rule:#232E3B; --rule-2:#374553;
    --accent:#FF5CA8; --accent-soft:#2B1322; --accent-ink:#FF8FC4; --on-accent:#11060C;
    --cyan:#4FBACE; --cyan-soft:#0D2930;
    --due:#E9AE5A; --due-soft:#2A2013;
    --ok:#3FD98F; --ok-soft:#0E2720; --bad:#FF6F61; --bad-soft:#2B1411;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#080B10; --surface:#111721; --surface-2:#171F2A; --surface-3:#1F2937;
  --ink:#E6ECF3; --ink-2:#9AA7B5; --ink-3:#6B7785;
  --rule:#232E3B; --rule-2:#374553;
  --accent:#FF5CA8; --accent-soft:#2B1322; --accent-ink:#FF8FC4; --on-accent:#11060C;
  --cyan:#4FBACE; --cyan-soft:#0D2930;
  --due:#E9AE5A; --due-soft:#2A2013;
  --ok:#3FD98F; --ok-soft:#0E2720; --bad:#FF6F61; --bad-soft:#2B1411;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-ui); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }

.lbl{font-family:var(--f-num); font-size:10px; font-weight:500;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3)}
.num{font-family:var(--f-num); font-variant-numeric:tabular-nums}
.hidden{display:none !important}

/* ── Üst şerit ── */
.bar{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:7px;
  padding:9px 12px; background:var(--surface); border-bottom:1px solid var(--rule);
  padding-top:calc(9px + env(safe-area-inset-top))}
.bar .logo{display:flex; align-items:center; gap:8px; font-weight:700; font-size:14.5px;
  letter-spacing:-.01em; white-space:nowrap}
.bar .logo svg{width:18px; height:18px; flex:none}
.bar .logo .long{display:inline}
@media (max-width:430px){ .bar .logo .long{display:none} }
.bar .sp{flex:1}
.tbtn{border:1px solid var(--rule); border-radius:var(--r); padding:6px 9px;
  font-family:var(--f-num); font-size:10.5px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-2); white-space:nowrap}
.tbtn:hover{border-color:var(--rule-2); color:var(--ink)}
.tbtn.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink)}
#bWho{font-family:var(--f-ui); font-size:12px; font-weight:600; letter-spacing:0;
  text-transform:none; color:var(--ink-2); max-width:9rem; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
@media (max-width:560px){ #bWho{display:none} }

.page{max-width:760px; margin:0 auto; padding:18px 14px 80px}
@media (min-width:720px){ .page{padding:26px 20px 90px} }
h1{margin:0 0 4px; font-size:23px; font-weight:700; letter-spacing:-.022em; text-wrap:balance}
.sub{margin:0 0 18px; color:var(--ink-2); font-size:14px}

/* ── Desteler ── */
.topstat{display:block; width:100%; text-align:left; background:var(--surface);
  border:1px solid var(--rule); border-radius:var(--r); padding:11px 13px;
  margin-bottom:16px; transition:border-color .12s}
.topstat:hover{border-color:var(--rule-2)}
.topstat .tsline{display:flex; align-items:baseline; gap:10px; margin-bottom:8px}
.topstat .who{font-size:13.5px; font-weight:600; letter-spacing:-.01em; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.topstat .tsline .lbl{margin-left:auto; flex:none}
.topstat .tsbar{height:4px; background:var(--surface-3); border-radius:99px;
  overflow:hidden; margin-bottom:8px}
.topstat .tsbar i{display:block; height:100%; background:var(--cyan); border-radius:99px;
  transition:width .3s ease}
.topstat .tsnums{display:flex; flex-wrap:wrap; gap:2px 15px; align-items:baseline;
  font-size:12px; color:var(--ink-3); line-height:1.6}
.topstat .tsnums b{font-weight:500; color:var(--ink-2)}
.topstat .tsnums b.ok{color:var(--ok)} .topstat .tsnums b.bad{color:var(--bad)}
.topstat .tsnums b.due{color:var(--due)}
.topstat .dot{color:var(--rule-2)}
.modcard{background:var(--surface); border:1px solid var(--rule); border-left:3px solid var(--accent);
  border-radius:var(--r); padding:14px 15px; margin-bottom:12px; box-shadow:var(--shadow)}
.modcard.done{border-left-color:var(--ok)}
.modcard .mtop{display:flex; align-items:center; gap:10px; margin-bottom:7px}
.modcard .mtop .lbl{flex:1}
.modcard .mname{font-size:18px; font-weight:600; letter-spacing:-.015em; line-height:1.3;
  text-wrap:balance}
.modcard .mname b{font-family:var(--f-num); font-weight:500; color:var(--accent)}
.modcard .mbar{height:5px; background:var(--surface-3); border-radius:99px; overflow:hidden;
  margin:10px 0 7px}
.modcard .mbar i{display:block; height:100%; background:var(--accent); border-radius:99px;
  transition:width .3s ease}
.modcard.done .mbar i{background:var(--ok)}
.modcard .mfoot{font-size:12.5px; color:var(--ink-2)}
.modcard .mfoot .num{color:var(--ink); font-weight:500}
.nextmod{display:block; width:100%; text-align:left; background:var(--surface);
  border:1px solid var(--rule); border-left:2px solid var(--cyan); border-radius:var(--r);
  padding:11px 13px; font-size:12.5px; color:var(--ink-2); margin-bottom:10px}
.nextmod:hover{border-color:var(--rule-2); color:var(--ink)}
.nextmod b{font-family:var(--f-num); color:var(--cyan)}
.decks{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:12px}
@media (min-width:620px){ .decks{grid-template-columns:repeat(4,1fr)} }
.deck{display:flex; flex-direction:column; gap:3px; text-align:left;
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  padding:13px 13px 12px; transition:border-color .12s, transform .08s}
.deck:hover:not(:disabled){border-color:var(--rule-2)}
.deck:active:not(:disabled){transform:scale(.985)}
.deck:disabled{opacity:.42; cursor:not-allowed}
.deck.on{border-color:var(--accent); background:var(--accent-soft)}
.deck .v{font-family:var(--f-num); font-size:25px; font-weight:500; line-height:1.05;
  font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.deck .t{font-size:12.5px; font-weight:600}
.deck .d{font-size:11px; color:var(--ink-3); line-height:1.35}
.deck.due .v{color:var(--due)} .deck.wrong .v{color:var(--bad)}
.deck.new .v{color:var(--cyan)} .deck.star .v{color:var(--accent)}
.deck.on .d,.deck.on .t{color:var(--accent-ink)}

.gobar{display:flex; gap:9px; margin:14px 0 18px}
.go{flex:1; background:var(--accent); color:var(--on-accent); border-radius:var(--r);
  padding:15px 20px; font-size:16px; font-weight:600; text-align:center}
.go:hover{filter:brightness(1.07)}
.go:disabled{opacity:.4; cursor:not-allowed; filter:none}
.go2{flex:none; background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  padding:15px 16px; font-size:14px; font-weight:500; color:var(--ink-2)}
.go2:hover{border-color:var(--rule-2); color:var(--ink)}

/* ── Akordeon kutular ── */
.box{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  margin-bottom:10px; overflow:hidden}
.box > summary{list-style:none; cursor:pointer; padding:12px 14px; display:flex;
  align-items:center; gap:9px; background:var(--surface-2);
  border-bottom:1px solid transparent; font-size:13.5px; font-weight:600}
.box > summary::-webkit-details-marker{display:none}
.box[open] > summary{border-bottom-color:var(--rule)}
.box > summary .chev{margin-left:auto; color:var(--ink-3); font-family:var(--f-num);
  font-size:12px; transition:transform .15s}
.box[open] > summary .chev{transform:rotate(90deg)}
.box .in{padding:13px}
.pill{font-family:var(--f-num); font-size:10px; font-weight:500; letter-spacing:.04em;
  color:var(--accent-ink); background:var(--accent-soft); border:1px solid var(--accent);
  border-radius:99px; padding:2px 8px}
.pill.off{color:var(--ink-3); background:var(--surface-3); border-color:var(--rule)}

/* ── Konu ağacı ── */
.tools{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap}
.tree{border:1px solid var(--rule); border-radius:var(--r); overflow:hidden}
.node + .node{border-top:1px solid var(--rule)}
.row{display:flex; align-items:center; gap:0; background:var(--surface)}
.row:hover{background:var(--surface-2)}
.tick{flex:none; width:38px; height:42px; display:grid; place-items:center;
  font-family:var(--f-num); font-size:13px; color:var(--ink-3)}
.tick.all{color:var(--accent)} .tick.some{color:var(--accent); opacity:.75}
.nm{flex:1; text-align:left; padding:11px 4px 11px 0; font-size:13.5px; font-weight:500;
  min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.nm b{font-family:var(--f-num); font-size:10.5px; font-weight:500; color:var(--ink-3);
  margin-left:7px}
.exp{flex:none; width:36px; height:42px; display:grid; place-items:center;
  color:var(--ink-3); font-family:var(--f-num); font-size:12px; transition:transform .15s}
.exp.open{transform:rotate(90deg); color:var(--ink-2)}
.kids{background:var(--surface-2); border-top:1px solid var(--rule)}
.kids .row{background:transparent; padding-left:14px}
.kids .row:hover{background:var(--surface-3)}
.kids .nm{font-size:12.5px; font-weight:400; color:var(--ink-2)}
.kids .tick{height:36px} .kids .nm{padding:8px 4px 8px 0}
.node.sel > .row{background:var(--accent-soft)}
.node.sel > .row .nm{color:var(--accent-ink)}

.switch{display:flex; align-items:center; gap:10px; padding:9px 11px; width:100%;
  background:var(--surface-2); border:1px solid var(--rule); border-radius:var(--r);
  text-align:left; font-size:13px; font-weight:500; color:var(--ink-2); margin-bottom:6px}
.switch:hover{border-color:var(--rule-2)}
.switch .knob{flex:none; width:32px; height:18px; border-radius:99px;
  background:var(--rule-2); position:relative; transition:background .15s}
.switch .knob::after{content:''; position:absolute; top:2px; left:2px; width:14px; height:14px;
  border-radius:50%; background:var(--surface); transition:transform .15s}
.switch.on{color:var(--ink); border-color:var(--accent)}
.switch.on .knob{background:var(--accent)}
.switch.on .knob::after{transform:translateX(14px)}
.switch .n{margin-left:auto; font-family:var(--f-num); font-size:10.5px; color:var(--ink-3)}

.grp{margin-bottom:15px} .grp:last-child{margin-bottom:0}
.grp > .lbl{display:block; margin-bottom:7px}
input[type=search], select, textarea{width:100%; padding:10px 12px; font-size:14.5px;
  background:var(--surface-2); color:var(--ink); border:1px solid var(--rule);
  border-radius:var(--r)}
textarea#bak{height:60px; resize:vertical; font-family:var(--f-num); font-size:11px;
  line-height:1.45; color:var(--ink-2)}
input:focus, select:focus, textarea:focus{border-color:var(--accent); outline:none;
  box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:flex; border:1px solid var(--rule); border-radius:var(--r); overflow:hidden}
.seg button{flex:1; background:var(--surface-2); padding:9px 6px; font-size:12.5px;
  font-weight:500; color:var(--ink-2)}
.seg button + button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--accent); color:var(--on-accent)}
.note{font-size:12.5px; color:var(--ink-2); margin-top:6px}
.note b{font-family:var(--f-num); color:var(--ink); font-weight:500}

/* ── Soru ── */
.prog{height:3px; background:var(--rule); border-radius:2px; overflow:hidden; margin-bottom:8px}
.prog i{display:block; height:100%; background:var(--accent); width:0; transition:width .25s ease}
.prog i.retry{background:var(--bad)}
.meta{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:12px}
.card{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  box-shadow:var(--shadow); overflow:hidden}
.head{display:flex; align-items:center; gap:7px; flex-wrap:wrap; padding:9px 13px;
  background:var(--surface-2); border-bottom:1px solid var(--rule)}
.head .who{font-size:11.5px; font-weight:500; color:var(--ink-2); min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.head .sp{flex:1}
.tag{font-family:var(--f-num); font-size:9px; letter-spacing:.1em; text-transform:uppercase;
  border:1px solid currentColor; border-radius:2px; padding:2px 5px; white-space:nowrap}
.tag.fig{color:var(--ink-2)} .tag.gen{color:var(--cyan)}
.tag.flag{color:var(--accent-ink); background:var(--accent-soft)}
.tag.box{color:var(--due); background:var(--due-soft)}
.starbtn{font-size:15px; line-height:1; padding:2px 4px; color:var(--ink-3)}
.starbtn.on{color:var(--accent)}
.qt{font-family:var(--f-read); font-size:18px; line-height:1.5; padding:19px 15px 6px;
  white-space:pre-wrap; text-wrap:pretty}
@media (min-width:720px){ .qt{font-size:19.5px} }
.opts{display:flex; flex-direction:column; gap:7px; padding:11px}
.opt{display:flex; gap:11px; align-items:flex-start; text-align:left; width:100%;
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  padding:12px; font-family:var(--f-read); font-size:16px; line-height:1.45;
  min-height:50px; transition:border-color .1s, background .1s}
.opt:hover:not(:disabled){border-color:var(--rule-2); background:var(--surface-2)}
.opt:disabled{cursor:default}
.opt .k{flex:none; width:23px; height:23px; margin-top:1px; display:grid; place-items:center;
  border:1px solid var(--rule-2); border-radius:3px; font-family:var(--f-num);
  font-size:11px; font-weight:500; color:var(--ink-2)}
.opt .m{margin-left:auto; padding-left:8px; font-family:var(--f-num); font-size:9.5px;
  letter-spacing:.08em; align-self:center}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.right .k{background:var(--ok); border-color:var(--ok); color:var(--surface)}
.opt.right .m{color:var(--ok)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad); border-color:var(--bad); color:var(--surface)}
.opt.wrong .m{color:var(--bad)}
.opt.sel{border-color:var(--accent)}
.opt.sel .k{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.verdict{display:flex; gap:10px; align-items:flex-start; padding:12px 15px;
  border-top:1px solid var(--rule); background:var(--surface-2)}
.verdict .p{font-family:var(--f-num); font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; padding:3px 7px; border-radius:2px; flex:none}
.verdict.ok .p{background:var(--ok); color:var(--surface)}
.verdict.bad .p{background:var(--bad); color:var(--surface)}
.verdict .x{font-size:13px; color:var(--ink-2); min-width:0}
.verdict .x b{font-family:var(--f-read); font-size:15px; font-weight:600; color:var(--ink)}
.verdict .x s{display:block; margin-top:3px; font-family:var(--f-num); font-size:9.5px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); text-decoration:none}
.acts{display:flex; gap:8px; margin-top:13px}
.acts .go{flex:1}
@media (max-width:719px){
  .acts{position:sticky; bottom:0; margin:13px -14px 0; padding:10px 14px;
    background:var(--surface); border-top:1px solid var(--rule);
    padding-bottom:calc(10px + env(safe-area-inset-bottom))}
}

/* ── Özet ── */
.score{font-family:var(--f-num); font-size:54px; font-weight:500; line-height:1;
  font-variant-numeric:tabular-nums; letter-spacing:-.035em}
.rrow{display:flex; gap:10px; align-items:flex-start; padding:12px 15px;
  border-bottom:1px solid var(--rule)}
.rrow:last-child{border-bottom:none}
.rdot{flex:none; width:7px; height:7px; border-radius:50%; margin-top:7px}
.rdot.ok{background:var(--ok)} .rdot.bad{background:var(--bad)}
.rrow .q{font-family:var(--f-read); font-size:14px; line-height:1.45}
.rrow .a{font-size:12px; color:var(--ink-2); margin-top:3px}
.rrow .a b{color:var(--ok); font-weight:600} .rrow .a i{color:var(--bad); font-style:normal}

/* ── Paneller ── */
.sheet{position:fixed; inset:0; z-index:50; display:none}
.sheet.on{display:block}
.sheet .veil{position:absolute; inset:0; background:rgba(8,11,16,.55)}
.sheet .body{position:absolute; inset:auto 0 0 0; max-height:88vh; overflow-y:auto;
  background:var(--paper); border-top:1px solid var(--rule);
  border-radius:10px 10px 0 0; padding:16px 14px calc(24px + env(safe-area-inset-bottom));
  animation:up .18s ease}
@keyframes up{from{transform:translateY(14px); opacity:.6}to{transform:none; opacity:1}}
@media (min-width:720px){
  .sheet .body{inset:0 0 0 auto; width:min(560px, 92vw); max-height:none; border-radius:0;
    border-left:1px solid var(--rule); border-top:none; padding:20px 18px}
}
.sheet h2{margin:0 0 13px; font-size:17px; font-weight:700; letter-spacing:-.02em;
  display:flex; align-items:center; gap:10px}
.sheet h2 .sp{flex:1}
.whobox{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  padding:12px 13px; margin-bottom:14px}
.whorow{display:flex; gap:7px; align-items:center; margin-top:6px}
.whorow input, .whorow select{flex:1; min-width:0; padding:8px 10px; font-size:14px}
.whorow .tbtn{flex:none; padding:9px 11px}
.stat4{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px}
.stat4 .s{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  padding:11px 12px}
.stat4 .s .v{font-family:var(--f-num); font-size:22px; font-weight:500; line-height:1.1;
  font-variant-numeric:tabular-nums}
.stat4 .s .v.ok{color:var(--ok)} .stat4 .s .v.bad{color:var(--bad)}
.stat4 .s .v.due{color:var(--due)}
.tbl{width:100%; border-collapse:collapse; font-size:12.5px}
.tbl th{text-align:left; font-family:var(--f-num); font-size:9.5px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-3); font-weight:500; padding:0 8px 7px;
  border-bottom:1px solid var(--rule)}
.tbl td{padding:8px; border-bottom:1px solid var(--rule)}
.tbl tr:last-child td{border-bottom:none}
.tbl td.n{font-family:var(--f-num); font-variant-numeric:tabular-nums; text-align:right;
  white-space:nowrap}
.bar2{height:5px; background:var(--surface-3); border-radius:99px; overflow:hidden; min-width:44px}

.notelist{display:flex; flex-direction:column; gap:7px}
.noteitem{display:flex; align-items:center; gap:10px; text-align:left; width:100%;
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);

.md p{margin:0 0 11px}
.md ul,.md ol{margin:0 0 12px; padding-left:20px}
.md li{margin-bottom:4px}
.md code{font-family:var(--f-num); font-size:12.5px; background:var(--surface-2);
  border:1px solid var(--rule); border-radius:3px; padding:1px 5px}

.md blockquote{margin:0 0 12px; padding:8px 12px; border-left:2px solid var(--accent);
  background:var(--surface-2); font-size:14.5px; color:var(--ink-2)}
.md hr{border:none; border-top:1px solid var(--rule); margin:18px 0}
.md .tw{overflow-x:auto; margin:0 0 14px; border:1px solid var(--rule); border-radius:var(--r)}
.md table{width:100%; border-collapse:collapse; font-family:var(--f-ui); font-size:12.5px}

  border-bottom:1px solid var(--rule); white-space:nowrap}

.md tr:last-child td{border-bottom:none}

  border:1px dashed var(--rule); border-radius:var(--r); background:var(--surface)}

  border:1px solid var(--rule); border-radius:3px; padding:1px 5px; color:var(--ink-2)}

  <span class="logo">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M2 14.5 22 6l-3.5 8.5L22 23 2 14.5Z" fill="var(--accent)"/>
    </svg>PPL<span class="long"> Çalışma</span>
  </span>
  <span class="sp"></span>

  <button class="tbtn" id="bNotes" type="button">Konu</button>
  <button class="tbtn" id="bStats" type="button">Durum</button>
  <button class="tbtn" id="bTheme" type="button">Tema</button>
</div>

<div class="page" id="view"></div>

<div class="sheet" id="sheet">
  <div class="veil" id="veil"></div>
  <div class="body" id="sheetBody"></div>
</div>

<script id="qdata" type="application/json">__DATA__</script>
<script>
(function(){
"use strict";

const DB = JSON.parse(document.getElementById('qdata').textContent);
const SUBJ = DB.s, QS = DB.q, NOTES = DB.n || [];
// soru: [0]id [1]dersIdx [2]bölümIdx [3]metin [4]şıklar [5]tartışmalı [6]tekrar [7]üretilmiş [8]şekil
const BY_ID = new Map(QS.map(q => [q[0], q]));
const KEYS = ['A','B','C','D','E'];
const DAY = 864e5;
const BOX_MS = [10*6e4, DAY, 3*DAY, 7*DAY, 16*DAY, 35*DAY];
const LEECH = 4, MASTER = 2;

const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = n => n.toLocaleString('tr-TR');
const today = () => new Date().toISOString().slice(0,10);
const ls = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
             set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
             del(k){ try{ localStorage.removeItem(k); }catch(e){} } };

// ── Profiller: giriş yok. İlk ziyarette rastgele bir ad verilir, sonra değiştirilebilir ──
const AD1 = ['Sakin','Hızlı','Gümüş','Kuzey','Berrak','Serin','Altın','Mavi','Keskin',
             'Sessiz','Yüksek','Uzak','Parlak','Çevik'];
const AD2 = ['Kanat','Rüzgâr','Pervane','Rota','Ufuk','Bulut','Yıldız','Pist','Şahin',
             'Turna','Kartal','İrtifa','Kule','Yaklaşma'];
function randomName(taken){
  for (let i = 0; i < 60; i++){
    const n = AD1[Math.floor(Math.random()*AD1.length)] + ' ' +
              AD2[Math.floor(Math.random()*AD2.length)];
    if (!taken.includes(n)) return n;
  }
  return 'Pilot ' + Math.floor(Math.random()*9000 + 1000);
}

let PROFILES = [];
try{ PROFILES = JSON.parse(ls.get('atpl.profiles') || '[]'); }catch(e){ PROFILES = []; }
if (!Array.isArray(PROFILES)) PROFILES = [];
if (ls.get('atpl.v2') && !PROFILES.length) PROFILES = ['Ben'];   // eski tek profilli kayıt
if (!PROFILES.length){                    // siteye ilk kez giriliyor
  PROFILES = [randomName([])];
  ls.set('atpl.profiles', JSON.stringify(PROFILES));
  ls.set('atpl.profile', PROFILES[0]);
}
let ME = ls.get('atpl.profile') || PROFILES[0];
if (!PROFILES.includes(ME)) ME = PROFILES[0];
const keyOf = p => 'atpl.v2:' + p;

const blank = () => ({ v:2, c:{}, star:[], day:{}, pref:{} });
let S = blank();
function loadProfile(){
  S = blank();
  let raw = ls.get(keyOf(ME));
  if (!raw && ME === PROFILES[0]) raw = ls.get('atpl.v2');   // eski tek profilli kayıt
  try{ const p = JSON.parse(raw || 'null'); if (p && p.v === 2) S = Object.assign(blank(), p); }catch(e){}
  Object.assign(F, DEFAULTS, S.pref || {});
  if (!F.pick || typeof F.pick !== 'object') F.pick = {};
}
let saveT;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(() => ls.set(keyOf(ME), JSON.stringify(S)), 250);
}
function renameProfile(oldN, newN){
  const data = ls.get(keyOf(oldN));
  ls.set(keyOf(newN), data || JSON.stringify(S));
  ls.del(keyOf(oldN));
  PROFILES = PROFILES.map(x => x === oldN ? newN : x);
  ls.set('atpl.profiles', JSON.stringify(PROFILES));
  ME = newN; ls.set('atpl.profile', ME);
  paintWho();
}

function switchProfile(name){
  ls.set(keyOf(ME), JSON.stringify(S));
  ME = name; ls.set('atpl.profile', ME);
  if (!PROFILES.includes(name)){ PROFILES.push(name); ls.set('atpl.profiles', JSON.stringify(PROFILES)); }
  loadProfile(); paintWho(); R = null; closeSheet(); home();
}

// ── Filtreler ──
// count:0 = sınır yok, kapsamdaki tüm sorular
// deck:'new' = varsayılan olarak henüz çözülmemişlerden başla, tüm konular
const DEFAULTS = { deck:'new', pick:{}, q:'', hideDup:true, gen:true, hideFig:true,
                   hideFlag:false, count:0, mode:'study', order:'smart' };
const F = Object.assign({}, DEFAULTS);
function savePref(){ S.pref = F; save(); }

const card = id => S.c[id];
const stars = () => new Set(S.star);

function grade(id, ok){
  const k = S.c[id] || [0,0,0,0,0];
  k[2]++;
  if (ok){ k[4]++; k[0] = Math.min(k[0] + 1, BOX_MS.length - 1); }
  else { k[3]++; k[4] = 0; k[0] = 0; }
  k[1] = Date.now() + BOX_MS[k[0]];
  S.c[id] = k;
  const d = S.day[today()] || [0,0];
  d[0]++; if (ok) d[1]++;
  S.day[today()] = d;
  save();
}

// Konu seçimi:  F.pick = { "050": [] }  boş dizi = dersin tamamı
function pickedAny(){ return Object.keys(F.pick).length > 0; }
function matchPick(q){
  if (!pickedAny()) return true;
  const s = SUBJ[q[1]];
  const sel = F.pick[s.c];
  if (!sel) return false;
  return sel.length === 0 || sel.includes(s.sec[q[2]][0]);
}
function inScope(q){
  if (F.hideDup && q[6]) return false;
  if (!F.gen && q[7]) return false;
  if (F.hideFig && q[8]) return false;
  if (F.hideFlag && q[5]) return false;
  if (!matchPick(q)) return false;
  if (F.q){
    const n = F.q.toLocaleLowerCase('tr');
    if (!(q[0] + ' ' + q[3] + ' ' + q[4].join(' ')).toLocaleLowerCase('tr').includes(n)) return false;
  }
  return true;
}
// Konu ağacındaki sayılar seçimden bağımsız, diğer anahtarlara bağlıdır
function inToggles(q){
  return !(F.hideDup && q[6]) && (F.gen || !q[7]) && !(F.hideFig && q[8]) && !(F.hideFlag && q[5]);
}

const DECKS = [
  { k:'due',   cls:'due',   t:'Tekrar zamanı', d:'Vadesi gelenler' },
  { k:'wrong', cls:'wrong', t:'Yanlışlarım',   d:'Henüz oturmayanlar' },
  { k:'new',   cls:'new',   t:'Hiç görmedim',  d:'İlk kez çıkacak' },
  { k:'star',  cls:'star',  t:'Yıldızlılar',   d:'Sonra bakılacaklar' },
];
function inDeck(q, deck){
  const k = card(q[0]), now = Date.now();
  switch (deck){
    case 'due':   return !!k && k[1] <= now;
    case 'wrong': return !!k && k[3] > 0 && k[4] < MASTER;
    case 'new':   return !k;
    case 'star':  return stars().has(q[0]);
    case 'leech': return !!k && k[3] >= LEECH;
    default:      return true;
  }
}
const scoped = () => QS.filter(inScope);
const deckCount = d => scoped().filter(q => inDeck(q, d)).length;

/** Profilin tümüne ait durum — modül seçiminden bağımsız. */
function globalStat(){
  const all = QS.filter(inToggles);
  let seen = 0, ans = 0, ok = 0;
  all.forEach(q => {
    const k = S.c[q[0]];
    if (k){ seen++; ans += k[2]; ok += k[2] - k[3]; }
  });
  const now = Date.now();
  let due = 0, wrong = 0;
  all.forEach(q => {
    const k = S.c[q[0]];
    if (!k) return;
    if (k[1] <= now) due++;
    if (k[3] > 0 && k[4] < MASTER) wrong++;
  });
  // gün serisi
  let streak = 0;
  for (let i = 0; i < 400; i++){
    const d = new Date(now - i*DAY).toISOString().slice(0,10);
    if ((S.day[d] || [0,0])[0]) streak++;
    else if (i > 0) break;
  }
  return { total: all.length, seen, ans, ok, due, wrong, streak,
           pct: ans ? Math.round(ok / ans * 100) : null };
}

/** Bir modülün (dersin) durumu: toplam, görülen, kalan. */
function moduleStat(code){
  const si = SUBJ.findIndex(x => x.c === code);
  const all = QS.filter(q => q[1] === si && inToggles(q));
  const seen = all.filter(q => card(q[0])).length;
  return { code, name: SUBJ[si].n, total: all.length, seen, left: all.length - seen };
}
/** Seçim tek bir modülün tamamıysa o modülün kodunu, değilse null döner. */
function soloModule(){
  const ks = Object.keys(F.pick);
  return (ks.length === 1 && F.pick[ks[0]].length === 0) ? ks[0] : null;
}
/** Henüz bitmemiş modüller — sırayla ya da rastgele seçmek için. */
function openModules(){
  return SUBJ.map(s => moduleStat(s.c)).filter(m => m.total && m.left > 0);
}
/** İlk ziyarette ya da modül bitince yeni bir modül seçer. */
function autoPickModule(){
  const open = openModules();
  if (!open.length) return false;
  const m = open[Math.floor(Math.random() * open.length)];
  F.pick = {}; F.pick[m.code] = [];
  savePref();
  return true;
}

function buildQueue(){
  let pool = scoped().filter(q => inDeck(q, F.deck));
  if (F.order === 'smart'){
    pool = pool.map(q => {
      const k = card(q[0]);
      return { q, key: k ? -(Date.now() - k[1]) : 1e15 + Math.random() };
    }).sort((a,b) => a.key - b.key).map(x => x.q);
  } else shuffle(pool);
  return F.count ? pool.slice(0, F.count) : pool;
}
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const optOrder = q => shuffle(q[4].map((_, i) => i));

// ── Oturum ──
let R = null, advT = null;

function start(){
  const list = buildQueue();
  if (!list.length) return;
  R = { list, i:0, order:null, picked:null, log:[], t0:Date.now(), round:1, missed:[] };
  step0();
}
function step0(){
  clearTimeout(advT);
  if (!R) return;
  if (R.i >= R.list.length){
    // Tur bitti — bu turda yanlış yapılanlar varsa onlarla devam et
    if (R.missed.length){
      // missed soru id'si tutar, list soru nesnesi bekler
      R.list = shuffle(R.missed.map(id => BY_ID.get(id)).filter(Boolean));
      R.missed = []; R.i = 0; R.round++;
      if (!R.list.length) return done();
    } else return done();
  }
  R.order = optOrder(R.list[R.i]);
  R.picked = null;
  draw();
  window.scrollTo({ top:0, behavior:'smooth' });
}
function pick(pos){
  if (!R || R.picked !== null) return;
  const q = R.list[R.i], ok = R.order[pos] === 0;
  R.picked = pos;
  grade(q[0], ok);
  R.log.push({ id:q[0], ok, pick:R.order[pos], round:R.round });
  if (!ok && !R.missed.includes(q[0])) R.missed.push(q[0]);
  draw();
  clearTimeout(advT);
  if (F.mode === 'exam') advT = setTimeout(next, 150);
  else if (ok) advT = setTimeout(next, 580);
}
function next(){ clearTimeout(advT); if (R){ R.i++; step0(); } }

// ── Ana ekran ──
function home(){
  R = null;
  const total = scoped().length;
  const counts = {}; DECKS.forEach(d => counts[d.k] = deckCount(d.k));
  const leech = deckCount('leech');
  const ready = F.deck === 'all' ? total : counts[F.deck] || 0;
  const nSubj = Object.keys(F.pick).length;
  const nSec = Object.values(F.pick).reduce((a,b) => a + b.length, 0);
  const scopeTxt = !nSubj ? 'Tüm dersler'
    : nSubj + ' ders' + (nSec ? ' · ' + nSec + ' bölüm' : '');

  // Hangi modüldeyiz? Tek modül seçiliyse onu öne çıkar.
  const solo = soloModule();
  const m = solo ? moduleStat(solo) : null;
  const others = QS.filter(q => inToggles(q) && !matchPick(q));
  const otherDue = others.filter(q => inDeck(q, 'due')).length;
  const otherWrong = others.filter(q => inDeck(q, 'wrong')).length;

  let modCard;
  if (m){
    const doneAll = m.left === 0;
    const pctSeen = m.total ? Math.round(m.seen / m.total * 100) : 0;
    modCard =
      '<div class="modcard' + (doneAll ? ' done' : '') + '">' +
        '<div class="mtop"><span class="lbl">Şimdi çalıştığın modül</span>' +
          '<button class="tbtn" id="mSwap" type="button">Başka modül</button></div>' +
        '<div class="mname"><b>' + esc(m.code) + '</b> · ' + esc(m.name) + '</div>' +
        '<div class="mbar"><i style="width:' + pctSeen + '%"></i></div>' +
        '<div class="mfoot"><span class="num">' + m.seen + '</span> / ' +
          '<span class="num">' + m.total + '</span> soru görüldü' +
          (doneAll ? ' · <b style="color:var(--ok)">modülü bitirdin</b>'
                   : ' · <span class="num">' + m.left + '</span> kaldı') + '</div>' +
      '</div>';
  } else {
    const ks = Object.keys(F.pick);
    modCard =
      '<div class="modcard">' +
        '<div class="mtop"><span class="lbl">Seçili kapsam</span>' +
          '<button class="tbtn" id="mSwap" type="button">Modül seç</button></div>' +
        '<div class="mname">' + (ks.length ? esc(ks.join(', ')) + ' — karma seçim'
                                           : 'Tüm modüller') + '</div>' +
        '<div class="mfoot"><span class="num">' + nf(total) + '</span> soru kapsamda</div>' +
      '</div>';
  }

  const G = globalStat();
  const cov = G.total ? Math.round(G.seen / G.total * 100) : 0;
  const strip =
    '<button class="topstat" id="topStat" type="button" title="Ayrıntılı durum">' +
      '<div class="tsline"><span class="who">' + esc(ME) + '</span>' +
        '<span class="lbl">tüm PPL bankası</span></div>' +
      '<div class="tsbar"><i style="width:' + cov + '%"></i></div>' +
      '<div class="tsnums">' +
        '<span><b class="num">' + nf(G.seen) + '</b> / ' + nf(G.total) + ' soru görüldü</span>' +
        '<span><b class="num' + (G.pct === null ? '' : G.pct >= 75 ? ' ok' : G.pct < 50 ? ' bad' : '') +
          '">' + (G.pct === null ? '—' : '%' + G.pct) + '</b> başarı</span>' +
        (G.due ? '<span><b class="num due">' + G.due + '</b> tekrar zamanı</span>' : '') +
        (G.wrong ? '<span><b class="num bad">' + G.wrong + '</b> yanlış defteri</span>' : '') +
        (G.streak ? '<span><b class="num">' + G.streak + '</b> gün seri</span>' : '') +
      '</div>' +
    '</button>';

  el('view').innerHTML =
    strip +
    '<h1>Ne çalışalım?</h1>' +
    '<p class="sub">Modül modül ilerle. Bir modülü bitirince yenisine geçersin.</p>' +
    modCard +

    '<div class="decks">' + DECKS.map(d =>
      '<button class="deck ' + d.cls + (F.deck === d.k ? ' on' : '') + '" data-deck="' + d.k + '"' +
      (counts[d.k] ? '' : ' disabled') + ' type="button"><span class="v">' + counts[d.k] + '</span>' +
      '<span class="t">' + d.t + '</span><span class="d">' + d.d + '</span></button>').join('') +
    '</div>' +

    '<div class="gobar">' +
      '<button class="go" id="go" type="button"' + (ready ? '' : ' disabled') + '>' +
        (ready ? 'Başla · ' + (F.count ? Math.min(ready, F.count) : nf(ready)) + ' soru'
               : (m && m.left === 0 ? 'Bu modül bitti' : 'Bu kapsamda soru yok')) + '</button>' +
      '<button class="go2" id="goAll" type="button"' + (F.deck === 'all' ? ' disabled' : '') + '>Tümü</button>' +
    '</div>' +
    (m && m.left === 0 && openModules().length
      ? '<button class="nextmod" id="mNext" type="button">Sıradaki modüle geç ›</button>' : '') +
    ((otherDue + otherWrong)
      ? '<button class="nextmod" id="mAll" type="button">Diğer modüllerde <b class="num">' +
        (otherDue + otherWrong) + '</b> soru tekrar bekliyor — hepsini çöz ›</button>' : '') +

    '<details class="box" id="topicBox">' +
      '<summary>Konular<span class="pill' + (nSubj ? '' : ' off') + '">' + scopeTxt + '</span>' +
      '<span class="chev">›</span></summary><div class="in">' +
        '<div class="tools">' +
          '<button class="tbtn" id="tAll" type="button">Hepsini seç</button>' +
          '<button class="tbtn" id="tNone" type="button">Temizle</button>' +
        '</div><div class="tree" id="tree"></div></div></details>' +

    '<details class="box" id="optBox">' +
      '<summary>Ayarlar<span class="pill off">' + (F.count ? F.count + ' soru' : 'tüm tur') +
        ' · ' + (F.mode === 'study' ? 'çalışma' : 'sınav') + '</span><span class="chev">›</span></summary>' +
      '<div class="in">' +
        '<div class="grp"><span class="lbl">Ara</span>' +
          '<input type="search" id="q" placeholder="kelime ya da soru ID" value="' + esc(F.q) + '"></div>' +
        '<div class="grp"><span class="lbl">Kapsam</span><div id="sw"></div></div>' +
        '<div class="grp"><span class="lbl">Tur uzunluğu</span><div class="seg" id="cnt">' +
          [[0,'Tümü'],[20,'20'],[50,'50'],[100,'100']].map(([v,t]) =>
            '<button type="button" data-n="' + v + '" class="' + (F.count === v ? 'on' : '') +
            '">' + t + '</button>').join('') + '</div>' +
          '<div class="note">Tümü: kapsamdaki bütün sorular tek turda. ' +
          'İstediğin an <b>Çık</b> ile bırakabilirsin, ilerlemen kayıtlı kalır.</div></div>' +
        '<div class="grp"><span class="lbl">Mod</span><div class="seg" id="mode">' +
          '<button type="button" data-m="study" class="' + (F.mode === 'study' ? 'on' : '') + '">Çalışma</button>' +

// ── Konu ağacı (akordeon, varsayılan kapalı) ──
let expanded = {};
function buildTree(){
  const t = el('tree');
  t.innerHTML = SUBJ.map((s, si) => {
    const qs = QS.filter(q => q[1] === si && inToggles(q));
    if (!qs.length) return '';
    const sel = F.pick[s.c];
    const state = !sel ? '' : (sel.length === 0 ? 'all' : 'some');
    const secs = s.sec.map((sc, i) => {
      const n = qs.filter(q => q[2] === i).length;
      if (!n) return '';
      const on = sel && (sel.length === 0 || sel.includes(sc[0]));
      return '<div class="row"><button class="tick ' + (on ? 'all' : '') + '" data-s="' + s.c +
        '" data-c="' + sc[0] + '" type="button">' + (on ? '◼' : '◻') + '</button>' +
        '<button class="nm" data-s="' + s.c + '" data-c="' + sc[0] + '" type="button" title="' +
        esc(sc[1]) + '">' + esc(sc[1]) + '<b>' + n + '</b></button></div>';
    }).join('');
    return '<div class="node' + (state ? ' sel' : '') + '"><div class="row">' +
      '<button class="tick ' + state + '" data-s="' + s.c + '" type="button">' +
        (state === 'all' ? '◼' : state === 'some' ? '◧' : '◻') + '</button>' +
      '<button class="nm" data-s="' + s.c + '" type="button">' + s.c + ' · ' + esc(s.n) +
        '<b>' + qs.length + '</b></button>' +
      '<button class="exp' + (expanded[s.c] ? ' open' : '') + '" data-x="' + s.c +
        '" type="button" aria-label="Bölümler">›</button></div>' +
      '<div class="kids' + (expanded[s.c] ? '' : ' hidden') + '">' + secs + '</div></div>';
  }).join('');

  t.querySelectorAll('.exp').forEach(b => b.onclick = () => {
    expanded[b.dataset.x] = !expanded[b.dataset.x];
    buildTree(); openBox('topicBox');
  });
  t.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
    const s = b.dataset.s, c = b.dataset.c;
    if (c) toggleSection(s, c); else toggleSubject(s);
    savePref(); home(); openBox('topicBox');
  });
  el('tAll').onclick = () => { F.pick = {}; savePref(); home(); openBox('topicBox'); };
  el('tNone').onclick = () => { F.pick = {}; savePref(); home(); openBox('topicBox'); };
}
function toggleSubject(code){
  if (F.pick[code]) delete F.pick[code];
  else F.pick[code] = [];          // boş dizi = dersin tamamı
}
function toggleSection(code, sec){
  const s = SUBJ.find(x => x.c === code);
  const all = s.sec.map(x => x[0]);
  let sel = F.pick[code];
  if (!sel) sel = [];                       // ders seçili değildi
  else if (sel.length === 0) sel = all.slice();   // tamamı seçiliydi, tek tek yap
  else sel = sel.slice();
  const i = sel.indexOf(sec);
  i < 0 ? sel.push(sec) : sel.splice(i, 1);
  if (!sel.length) delete F.pick[code];
  else if (sel.length === all.length) F.pick[code] = [];
  else F.pick[code] = sel;
}

// ── Soru ekranı ──
function draw(){
  const q = R.list[R.i], s = SUBJ[q[1]], sec = s.sec[q[2]];
  const shown = R.picked !== null && F.mode === 'study';
  const k = card(q[0]), st = stars();
  const retry = R.round > 1;

  const opts = R.order.map((oi, pos) => {
    let cls = 'opt', mark = '';
    if (shown){
      if (oi === 0){ cls += ' right'; mark = 'DOĞRU'; }
      else if (pos === R.picked){ cls += ' wrong'; mark = 'SEÇTİN'; }
    } else if (pos === R.picked) cls += ' sel';
    return '<button class="' + cls + '" data-p="' + pos + '"' +
      (R.picked !== null ? ' disabled' : '') + ' type="button">' +
      '<span class="k">' + KEYS[pos] + '</span><span>' + esc(q[4][oi]) + '</span>' +
      (mark ? '<span class="m">' + mark + '</span>' : '') + '</button>';
  }).join('');

  let verdict = '';
  if (shown){
    const ok = R.order[R.picked] === 0;
    verdict = ok
      ? '<div class="verdict ok"><span class="p">Doğru</span><span class="x">Bildin. ' +
        'Sonraki soru geliyor…<s>' + when(card(q[0])) + '</s></span></div>'
      : '<div class="verdict bad"><span class="p">Yanlış</span><span class="x">' +
        'Doğru cevap: <b>' + esc(q[4][0]) + '</b><s>Bu turun sonunda tekrar sorulacak</s></span></div>';
  }

  const last = R.i === R.list.length - 1 && !R.missed.length;
  el('view').innerHTML =
    '<div class="prog"><i class="' + (retry ? 'retry' : '') + '" style="width:' +
      (R.i / R.list.length * 100) + '%"></i></div>' +
    '<div class="meta"><span class="lbl">Soru <span class="num">' + (R.i + 1) + '</span> / ' +
      '<span class="num">' + R.list.length + '</span></span>' +
      '<span class="lbl"' + (retry ? ' style="color:var(--bad)"' : '') + '>' +
        (retry ? 'Yanlış turu ' + R.round : deckName()) + '</span></div>' +
    '<div class="card"><div class="head"><span class="lbl">' + esc(s.c) + '</span>' +
      '<span class="who">' + esc(sec[1]) + '</span><span class="sp"></span>' +
      (k && k[0] > 0 ? '<span class="tag box">kutu ' + k[0] + '</span>' : '') +
      (q[8] ? '<span class="tag fig">şekil gerekli</span>' : '') +
      (q[7] ? '<span class="tag gen">üretilmiş</span>' : '') +
      (q[5] ? '<span class="tag flag">tartışmalı</span>' : '') +
      '<button class="starbtn' + (st.has(q[0]) ? ' on' : '') + '" id="star" type="button" ' +
        'title="Yıldızla (S)">' + (st.has(q[0]) ? '★' : '☆') + '</button>' +
      '<span class="lbl num">' + q[0] + '</span></div>' +
      '<div class="qt">' + esc(q[3]) + '</div>' +
      '<div class="opts">' + opts + '</div>' + verdict + '</div>' +
    '<div class="acts">' +
      '<button class="go" id="next" type="button"' + (R.picked === null ? ' disabled' : '') + '>' +
        (last ? 'Bitir' : (shown && R.order[R.picked] !== 0 ? 'Anladım, devam' : 'Sonraki')) + '</button>' +
      (R.picked === null ? '<button class="go2" id="skip" type="button">Atla</button>' : '') +
      '<button class="go2" id="quit" type="button">Çık</button></div>';

  el('view').querySelectorAll('.opt').forEach(b => b.onclick = () => pick(+b.dataset.p));
  el('next').onclick = next;
  const sk = el('skip'); if (sk) sk.onclick = next;
  el('quit').onclick = done;
  el('star').onclick = () => {
    const i = S.star.indexOf(q[0]);
    i < 0 ? S.star.push(q[0]) : S.star.splice(i, 1);
    save(); draw();
  };
}
function when(k){
  if (!k) return '';
  const d = k[1] - Date.now();
  if (d < 36e5) return 'Tekrar: ' + Math.max(1, Math.round(d/6e4)) + ' dakika sonra';
  if (d < DAY)  return 'Tekrar: ' + Math.round(d/36e5) + ' saat sonra';
  return 'Tekrar: ' + Math.round(d/DAY) + ' gün sonra';
}
function deckName(){
  const d = DECKS.find(x => x.k === F.deck);
  if (d) return d.t;
  if (F.deck === 'leech') return 'Takıldıklarım';
  const ks = Object.keys(F.pick);
  return ks.length ? ks.join(', ') : 'Tüm dersler';
}

function done(){
  clearTimeout(advT);
  const log = R ? R.log : [], rounds = R ? R.round : 1;
  const t0 = R ? R.t0 : Date.now();
  R = null;
  if (!log.length) return home();

  const first = log.filter(x => x.round === 1);
  const ok = first.filter(x => x.ok).length;
  const pct = first.length ? Math.round(ok / first.length * 100) : 0;
  const mins = Math.max(1, Math.round((Date.now() - t0) / 6e4));
  const seen = [...new Set(log.map(x => x.id))];

  el('view').innerHTML =
    '<div class="card"><div style="padding:24px 16px; text-align:center">' +

function openStats(){
  let seen = 0, wrong = 0, tot = 0;
  Object.keys(S.c).forEach(id => { const k = S.c[id]; tot += k[2]; wrong += k[3]; seen++; });
  const pct = tot ? Math.round((tot - wrong) / tot * 100) : null;
  const dueN = deckCount('due'), wrongN = deckCount('wrong'), leech = deckCount('leech');

  const per = SUBJ.map((s, si) => {
    const qs = QS.filter(q => q[1] === si && !q[6]);
    let n = 0, o = 0, u = 0;
    qs.forEach(q => { const k = S.c[q[0]]; if (k){ u++; n += k[2]; o += k[2] - k[3]; } });
    return { c:s.c, bank:qs.length, uniq:u, n, pct: n ? Math.round(o/n*100) : null };
  });
  // en zayıf bölümler
  const secs = [];
  SUBJ.forEach((s, si) => s.sec.forEach((sc, i) => {
    let n = 0, o = 0;

      if (k){ n += k[2]; o += k[2] - k[3]; } } });
    if (n >= 4) secs.push({ c:sc[0], t:sc[1], n, pct: Math.round(o/n*100) });
  }));
  secs.sort((a,b) => a.pct - b.pct);

  const days = [];
  for (let i = 44; i >= 0; i--){
    const d = new Date(Date.now() - i*DAY).toISOString().slice(0,10);
    days.push([d, (S.day[d] || [0,0])[0]]);
  }
  const mx = Math.max(1, ...days.map(d => d[1]));
  const lvl = n => !n ? '' : n < mx*.25 ? 'l1' : n < mx*.5 ? 'l2' : n < mx*.8 ? 'l3' : 'l4';

  el('impFile').onchange = e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { const r = merge(rd.result);
      if (r === true){ closeSheet(); home(); } else msg(r); };
    rd.readAsText(f); e.target.value = '';
  };
  let armed = false;
  el('wipe').onclick = () => {
    if (!armed){ armed = true; el('wipe').textContent = 'Emin misin? Tekrar bas';
      setTimeout(() => { armed = false; const w = el('wipe'); if (w) w.textContent = 'Sıfırla'; }, 4000);
      return; }
    S = blank(); Object.assign(F, DEFAULTS); save(); closeSheet(); home();
  };
}

/** Yedek metnini mevcut ilerlemeyle birleştirir; daha çok görülmüş kayıt kazanır. */
function merge(text){
  let p;
  try{ p = JSON.parse(text); }catch(e){ return 'Metin bozuk — tamamını kopyaladığından emin ol.'; }
  if (!p || p.v !== 2 || typeof p.c !== 'object') return 'Bu bir ATPL Çalışma yedeği değil.';
  Object.keys(p.c).forEach(id => {
    const a = S.c[id], b = p.c[id];
    if (Array.isArray(b) && b.length === 5 && (!a || b[2] > a[2])) S.c[id] = b;
  });
  S.star = Array.from(new Set(S.star.concat(p.star || [])));
  Object.keys(p.day || {}).forEach(d => {
    const a = S.day[d] || [0,0], b = p.day[d];
    if (Array.isArray(b)) S.day[d] = [Math.max(a[0], b[0]), Math.max(a[1], b[1])];
  });
  save();
  return true;
}

// ── Ders notları ──
function openNotes(id){
  if (id === undefined){
    el('sheetBody').innerHTML = '<h2>Konu anlatımı</h2>' +
      (NOTES.length
        ? '<div class="notelist">' + NOTES.map((n, i) =>
            '<button class="noteitem" data-n="' + i + '" type="button">' +
            (n.s ? '<span class="c">' + esc(n.s) + '</span>' : '<span class="c">—</span>') +
            '<span>' + esc(n.t) + '</span></button>').join('') + '</div>'
        : '<div class="empty">Henüz ders notu eklenmemiş.<br>' +
          '<span style="font-size:12px">notes/ klasörüne .md dosyası koyup ' +
          'build_web.py çalıştır.</span></div>') +
      '<div class="note" style="margin-top:14px">Notlar depodaki <b>notes/</b> klasöründen ' +
      'gelir; uygulamaya gömülüdür, internet gerekmez.</div>';
    el('sheet').classList.add('on');
    el('sheetBody').querySelectorAll('.noteitem').forEach(b =>
      b.onclick = () => openNotes(+b.dataset.n));
    return;
  }
  const n = NOTES[id];
  el('sheetBody').innerHTML =
    '<h2><button class="tbtn" id="nBack" type="button">‹ Geri</button>' +
      '<span class="sp"></span>' + (n.s ? '<span class="lbl">' + esc(n.s) + '</span>' : '') + '</h2>' +
    '<div class="md">' + md(n.md) + '</div>';
  el('nBack').onclick = () => openNotes();
  el('sheetBody').scrollTop = 0;
}

/** Küçük Markdown dönüştürücü — başlık, tablo, liste, kalın, kod, alıntı. */
function md(src){
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = src.replace(/\r/g, '').split('\n');
  const out = [];
  let i = 0, list = null;
  const closeList = () => { if (list){ out.push('</' + list + '>'); list = null; } };
  while (i < lines.length){
    const l = lines[i];
    if (/^\s*\|/.test(l) && /^\s*\|?[\s:-]*-[\s:|-]*$/.test(lines[i+1] || '')){
      closeList();
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const head = cells(l);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])){ rows.push(cells(lines[i])); i++; }
      out.push('<div class="tw"><table><thead><tr>' +
        head.map(h => '<th>' + inline(h) + '</th>').join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') +
        '</tbody></table></div>');
      continue;
    }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))){
      closeList(); out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>');
    } else if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)){ closeList(); out.push('<hr>'); }
    else if ((m = l.match(/^\s*>\s?(.*)$/))){ closeList(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>'); }
    else if ((m = l.match(/^\s*[-*+]\s+(.*)$/))){
      if (list !== 'ul'){ closeList(); out.push('<ul>'); list = 'ul'; }
      out.push('<li>' + inline(m[1]) + '</li>');
    } else if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))){
      if (list !== 'ol'){ closeList(); out.push('<ol>'); list = 'ol'; }
      out.push('<li>' + inline(m[1]) + '</li>');
    } else if (!l.trim()){ closeList(); }
    else {
      closeList();
      // Yumuşak satır sonları tek paragrafa toplanır
      const buf = [l];
      while (i + 1 < lines.length){
        const nx = lines[i+1];
        if (!nx.trim() || /^\s*([-*+]|\d+[.)])\s/.test(nx) || /^#{1,4}\s/.test(nx) ||
            /^\s*>/.test(nx) || /^\s*\|/.test(nx) || /^\s*(-{3,}|\*{3,})\s*$/.test(nx)) break;
        buf.push(nx); i++;
      }
      out.push('<p>' + inline(buf.join(' ')) + '</p>');
    }
    i++;
  }
  closeList();
  return out.join('');
}

function closeSheet(){ el('sheet').classList.remove('on'); }

// ── Olaylar ──
const th = ls.get('atpl.theme');
if (th) document.documentElement.setAttribute('data-theme', th);
el('bTheme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const nx = dark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nx);
  ls.set('atpl.theme', nx);
};
el('bWho').onclick = openStats;
el('bStats').onclick = openStats;
function paintWho(){ el('bWho').textContent = ME; }
el('bNotes').onclick = () => openNotes();
el('veil').onclick = closeSheet;

document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea')) return;
  if (e.key === 'Escape'){ closeSheet(); return; }
  if (!R) return;
  if (e.key >= '1' && e.key <= '5'){
    const p = +e.key - 1;
    if (p < R.order.length && R.picked === null){ pick(p); e.preventDefault(); }
  } else if (e.key === 'Enter' || e.key === 'ArrowRight'){
    if (R.picked !== null){ next(); e.preventDefault(); }
  } else if (e.key === 's' || e.key === 'S'){
    const b = el('star'); if (b){ b.click(); e.preventDefault(); }
  }
});

loadProfile();
if (!Object.keys(F.pick).length && !S.pref) autoPickModule();
if (!Object.keys(F.pick).length && !Object.keys(S.c).length) autoPickModule();
paintWho();
home();
})();
</script>
