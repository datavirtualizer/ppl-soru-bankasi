<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ATPL Çalışma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">

<style>
:root{
  --paper:#F2F4F7; --surface:#FFFFFF; --surface-2:#F6F8FA; --surface-3:#E9EEF3;
  --ink:#10151C; --ink-2:#4A5563; --ink-3:#7B8794;
  --rule:#D6DDE5; --rule-2:#B4BFCB;
  --accent:#C21A6B; --accent-soft:#FBE7F0; --accent-ink:#8E0F4C; --on-accent:#FFFFFF;
  --cyan:#0B6E7F; --cyan-soft:#E1F1F4;
  --due:#A8620A; --due-soft:#FBF0DE;
  --ok:#15764F; --ok-soft:#E2F3EB; --bad:#B32318; --bad-soft:#FBE9E7;
  --shadow:0 1px 2px rgba(16,21,28,.05), 0 12px 32px -18px rgba(16,21,28,.30);
  --f-ui:'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-read:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --f-num:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#080B10; --surface:#111721; --surface-2:#171F2A; --surface-3:#1F2937;
    --ink:#E6ECF3; --ink-2:#9AA7B5; --ink-3:#6B7785;
    --rule:#232E3B; --rule-2:#374553;
    --accent:#FF5CA8; --accent-soft:#2B1322; --accent-ink:#FF8FC4; --on-accent:#11060C;
    --cyan:#4FBACE; --cyan-soft:#0D2930;
    --due:#E9AE5A; --due-soft:#2A2013;
    --ok:#3FD98F; --ok-soft:#0E2720; --bad:#FF6F61; --bad-soft:#2B1411;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#080B10; --surface:#111721; --surface-2:#171F2A; --surface-3:#1F2937;
  --ink:#E6ECF3; --ink-2:#9AA7B5; --ink-3:#6B7785;
  --rule:#232E3B; --rule-2:#374553;
  --accent:#FF5CA8; --accent-soft:#2B1322; --accent-ink:#FF8FC4; --on-accent:#11060C;
  --cyan:#4FBACE; --cyan-soft:#0D2930;
  --due:#E9AE5A; --due-soft:#2A2013;
  --ok:#3FD98F; --ok-soft:#0E2720; --bad:#FF6F61; --bad-soft:#2B1411;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-ui); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }

.lbl{font-family:var(--f-num); font-size:10px; font-weight:500;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3)}
.num{font-family:var(--f-num); font-variant-numeric:tabular-nums}

/* ── Üst şerit ── */
.bar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:8px;
  padding:9px 12px; background:var(--surface); border-bottom:1px solid var(--rule);
  padding-top:calc(9px + env(safe-area-inset-top));
}
.bar .logo{display:flex; align-items:center; gap:8px; font-weight:700; font-size:14.5px;
  letter-spacing:-.01em; white-space:nowrap}
.bar .logo svg{width:18px; height:18px; flex:none}
.bar .sp{flex:1}
.tbtn{border:1px solid var(--rule); border-radius:var(--r); padding:6px 10px;
  font-family:var(--f-num); font-size:10.5px; letter-spacing:.07em;
  text-transform:uppercase; color:var(--ink-2); white-space:nowrap}
.tbtn:hover{border-color:var(--rule-2); color:var(--ink)}
.tbtn.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink)}

.page{max-width:760px; margin:0 auto; padding:18px 14px 80px}
@media (min-width:720px){ .page{padding:26px 20px 90px} }

h1{margin:0 0 4px; font-size:23px; font-weight:700; letter-spacing:-.022em; text-wrap:balance}
.sub{margin:0 0 20px; color:var(--ink-2); font-size:14px}

/* ── Deste kartları ── */
.decks{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:12px}
@media (min-width:620px){ .decks{grid-template-columns:repeat(4,1fr)} }
.deck{
  display:flex; flex-direction:column; gap:3px; text-align:left;
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  padding:13px 13px 12px; transition:border-color .12s, transform .08s;
}
.deck:hover:not(:disabled){border-color:var(--rule-2)}
.deck:active:not(:disabled){transform:scale(.985)}
.deck:disabled{opacity:.42; cursor:not-allowed}
.deck.on{border-color:var(--accent); background:var(--accent-soft)}
.deck .v{font-family:var(--f-num); font-size:25px; font-weight:500; line-height:1.05;
  font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.deck .t{font-size:12.5px; font-weight:600}
.deck .d{font-size:11px; color:var(--ink-3); line-height:1.35}
.deck.due .v{color:var(--due)} .deck.wrong .v{color:var(--bad)}
.deck.new .v{color:var(--cyan)} .deck.star .v{color:var(--accent)}
.deck.on .d, .deck.on .t{color:var(--accent-ink)}

.gobar{display:flex; gap:9px; margin:14px 0 22px}
.go{
  flex:1; background:var(--accent); color:var(--on-accent); border-radius:var(--r);
  padding:15px 20px; font-size:16px; font-weight:600; text-align:center;
}
.go:hover{filter:brightness(1.07)}
.go:disabled{opacity:.4; cursor:not-allowed; filter:none}
.go2{flex:none; background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  padding:15px 16px; font-size:14px; font-weight:500; color:var(--ink-2)}
.go2:hover{border-color:var(--rule-2); color:var(--ink)}

/* ── Filtre bloğu ── */
.box{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  margin-bottom:12px; overflow:hidden}
.box > summary{
  list-style:none; cursor:pointer; padding:12px 14px; display:flex; align-items:center;
  gap:10px; background:var(--surface-2); border-bottom:1px solid transparent;
  font-size:13.5px; font-weight:600;
}
.box > summary::-webkit-details-marker{display:none}
.box[open] > summary{border-bottom-color:var(--rule)}
.box > summary .chev{margin-left:auto; color:var(--ink-3); font-family:var(--f-num); font-size:11px}
.box[open] > summary .chev{transform:rotate(90deg)}
.box .in{padding:14px}
.grp{margin-bottom:16px}
.grp:last-child{margin-bottom:0}
.grp > .lbl{display:block; margin-bottom:8px}

.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  border:1px solid var(--rule); border-radius:99px; padding:6px 12px;
  font-size:12.5px; font-weight:500; color:var(--ink-2); background:var(--surface-2);
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.chip:hover{border-color:var(--rule-2); color:var(--ink)}
.chip.on{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.chip b{font-family:var(--f-num); font-size:10px; font-weight:500; opacity:.65}
.chip.on b{opacity:.85}

.switch{display:flex; align-items:center; gap:10px; padding:9px 11px; width:100%;
  background:var(--surface-2); border:1px solid var(--rule); border-radius:var(--r);
  text-align:left; font-size:13px; font-weight:500; color:var(--ink-2); margin-bottom:6px}
.switch:hover{border-color:var(--rule-2)}
.switch .knob{flex:none; width:32px; height:18px; border-radius:99px; background:var(--rule-2);
  position:relative; transition:background .15s}
.switch .knob::after{content:''; position:absolute; top:2px; left:2px; width:14px; height:14px;
  border-radius:50%; background:var(--surface); transition:transform .15s}
.switch.on{color:var(--ink); border-color:var(--accent)}
.switch.on .knob{background:var(--accent)}
.switch.on .knob::after{transform:translateX(14px)}
.switch .n{margin-left:auto; font-family:var(--f-num); font-size:10.5px; color:var(--ink-3)}

input[type=search], select{
  width:100%; padding:10px 12px; font-size:14.5px; background:var(--surface-2);
  color:var(--ink); border:1px solid var(--rule); border-radius:var(--r);
}
textarea#bak{
  width:100%; height:64px; resize:vertical; padding:9px 11px;
  font-family:var(--f-num); font-size:11px; line-height:1.45;
  background:var(--surface-2); color:var(--ink-2);
  border:1px solid var(--rule); border-radius:var(--r);
}
input[type=search]:focus, select:focus, textarea#bak:focus{border-color:var(--accent);
  outline:none; box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:flex; border:1px solid var(--rule); border-radius:var(--r); overflow:hidden}
.seg button{flex:1; background:var(--surface-2); padding:9px 6px; font-size:12.5px;
  font-weight:500; color:var(--ink-2)}
.seg button + button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--accent); color:var(--on-accent)}

.scopeline{font-size:12.5px; color:var(--ink-2); margin-top:2px}
.scopeline b{font-family:var(--f-num); color:var(--ink); font-weight:500}

/* ── Soru ── */
.prog{height:3px; background:var(--rule); border-radius:2px; overflow:hidden; margin-bottom:8px}
.prog i{display:block; height:100%; background:var(--accent); width:0; transition:width .25s ease}
.meta{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:12px}

.card{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  box-shadow:var(--shadow); overflow:hidden}
.head{display:flex; align-items:center; gap:7px; flex-wrap:wrap; padding:9px 13px;
  background:var(--surface-2); border-bottom:1px solid var(--rule)}
.head .who{font-size:11.5px; font-weight:500; color:var(--ink-2); min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.head .sp{flex:1}
.tag{font-family:var(--f-num); font-size:9px; letter-spacing:.1em; text-transform:uppercase;
  border:1px solid currentColor; border-radius:2px; padding:2px 5px; white-space:nowrap}
.tag.fig{color:var(--ink-2)} .tag.gen{color:var(--cyan)}
.tag.flag{color:var(--accent-ink); background:var(--accent-soft)}
.tag.box{color:var(--due); background:var(--due-soft)}
.starbtn{font-size:15px; line-height:1; padding:2px 4px; color:var(--ink-3)}
.starbtn.on{color:var(--accent)}

.qt{font-family:var(--f-read); font-size:18px; line-height:1.5; padding:19px 15px 6px;
  white-space:pre-wrap; text-wrap:pretty}
@media (min-width:720px){ .qt{font-size:19.5px} }
.opts{display:flex; flex-direction:column; gap:7px; padding:11px}
.opt{display:flex; gap:11px; align-items:flex-start; text-align:left; width:100%;
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  padding:12px 12px; font-family:var(--f-read); font-size:16px; line-height:1.45;
  min-height:50px; transition:border-color .1s, background .1s}
.opt:hover:not(:disabled){border-color:var(--rule-2); background:var(--surface-2)}
.opt:disabled{cursor:default}
.opt .k{flex:none; width:23px; height:23px; margin-top:1px; display:grid; place-items:center;
  border:1px solid var(--rule-2); border-radius:3px; font-family:var(--f-num);
  font-size:11px; font-weight:500; color:var(--ink-2)}
.opt .m{margin-left:auto; padding-left:8px; font-family:var(--f-num); font-size:9.5px;
  letter-spacing:.08em; align-self:center}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.right .k{background:var(--ok); border-color:var(--ok); color:var(--surface)}
.opt.right .m{color:var(--ok)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad); border-color:var(--bad); color:var(--surface)}
.opt.wrong .m{color:var(--bad)}
.opt.sel{border-color:var(--accent)}
.opt.sel .k{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}

.verdict{display:flex; gap:10px; align-items:flex-start; padding:12px 15px;
  border-top:1px solid var(--rule); background:var(--surface-2)}
.verdict .p{font-family:var(--f-num); font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; padding:3px 7px; border-radius:2px; flex:none}
.verdict.ok .p{background:var(--ok); color:var(--surface)}
.verdict.bad .p{background:var(--bad); color:var(--surface)}
.verdict .x{font-size:13px; color:var(--ink-2); min-width:0}
.verdict .x b{font-family:var(--f-read); font-size:15px; font-weight:600; color:var(--ink)}
.verdict .x s{display:block; margin-top:3px; font-family:var(--f-num); font-size:9.5px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); text-decoration:none}

.acts{display:flex; gap:8px; margin-top:13px}
.acts .go{flex:1}
@media (max-width:719px){
  .acts{position:sticky; bottom:0; margin:13px -14px 0; padding:10px 14px;
    background:var(--surface); border-top:1px solid var(--rule);
    padding-bottom:calc(10px + env(safe-area-inset-bottom))}
}

/* ── Özet ── */
.score{font-family:var(--f-num); font-size:54px; font-weight:500; line-height:1;
  font-variant-numeric:tabular-nums; letter-spacing:-.035em}
.rrow{display:flex; gap:10px; align-items:flex-start; padding:12px 15px;
  border-bottom:1px solid var(--rule)}
.rrow:last-child{border-bottom:none}
.rdot{flex:none; width:7px; height:7px; border-radius:50%; margin-top:7px}
.rdot.ok{background:var(--ok)} .rdot.bad{background:var(--bad)}
.rrow .q{font-family:var(--f-read); font-size:14px; line-height:1.45}
.rrow .a{font-size:12px; color:var(--ink-2); margin-top:3px}
.rrow .a b{color:var(--ok); font-weight:600} .rrow .a i{color:var(--bad); font-style:normal}

/* ── Panel (istatistik) ── */
.sheet{position:fixed; inset:0; z-index:50; display:none}
.sheet.on{display:block}
.sheet .veil{position:absolute; inset:0; background:rgba(8,11,16,.55)}
.sheet .body{
  position:absolute; inset:auto 0 0 0; max-height:88vh; overflow-y:auto;
  background:var(--paper); border-top:1px solid var(--rule);
  border-radius:10px 10px 0 0; padding:16px 14px calc(24px + env(safe-area-inset-bottom));
  animation:up .18s ease;
}
@keyframes up{from{transform:translateY(14px); opacity:.6}to{transform:none; opacity:1}}
@media (min-width:720px){
  .sheet .body{inset:0 0 0 auto; width:440px; max-height:none; border-radius:0;
    border-left:1px solid var(--rule); border-top:none; padding:20px 18px}
  @keyframes up{from{transform:translateX(14px); opacity:.6}to{transform:none; opacity:1}}
}
.sheet h2{margin:0 0 14px; font-size:17px; font-weight:700; letter-spacing:-.02em}

.stat4{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px}
.stat4 .s{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r);
  padding:11px 12px}
.stat4 .s .v{font-family:var(--f-num); font-size:22px; font-weight:500; line-height:1.1;
  font-variant-numeric:tabular-nums}
.stat4 .s .v.ok{color:var(--ok)} .stat4 .s .v.bad{color:var(--bad)}
.stat4 .s .v.due{color:var(--due)}

.tbl{width:100%; border-collapse:collapse; font-size:12.5px}
.tbl th{text-align:left; font-family:var(--f-num); font-size:9.5px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-3); font-weight:500; padding:0 8px 7px;
  border-bottom:1px solid var(--rule)}
.tbl td{padding:8px; border-bottom:1px solid var(--rule)}
.tbl tr:last-child td{border-bottom:none}
.tbl td.n{font-family:var(--f-num); font-variant-numeric:tabular-nums; text-align:right;
  white-space:nowrap}
.bar2{height:5px; background:var(--surface-3); border-radius:99px; overflow:hidden; min-width:48px}
.bar2 i{display:block; height:100%; background:var(--accent); border-radius:99px}
.bar2 i.ok{background:var(--ok)} .bar2 i.bad{background:var(--bad)}

.heat{display:grid; grid-template-columns:repeat(15,1fr); gap:3px; margin-bottom:6px}
.heat i{aspect-ratio:1; border-radius:2px; background:var(--surface-3)}
.heat i.l1{background:var(--accent-soft)} .heat i.l2{background:color-mix(in srgb, var(--accent) 45%, var(--surface-3))}
.heat i.l3{background:color-mix(in srgb, var(--accent) 70%, var(--surface-3))}
.heat i.l4{background:var(--accent)}

.empty{padding:38px 16px; text-align:center; color:var(--ink-3);
  border:1px dashed var(--rule); border-radius:var(--r); background:var(--surface)}
.hint{font-size:11.5px; line-height:1.55; color:var(--ink-3); margin-top:14px}
kbd{font-family:var(--f-num); font-size:10px; background:var(--surface-2);
  border:1px solid var(--rule); border-radius:3px; padding:1px 5px; color:var(--ink-2)}
.hidden{display:none !important}
</style>

<div class="bar">
  <span class="logo">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M2 14.5 22 6l-3.5 8.5L22 23 2 14.5Z" fill="var(--accent)"/>
    </svg>ATPL Çalışma
  </span>
  <span class="sp"></span>
  <button class="tbtn" id="bStats" type="button">Durum</button>
  <button class="tbtn" id="bTheme" type="button">Tema</button>
</div>

<div class="page" id="view"></div>

<div class="sheet" id="sheet">
  <div class="veil" id="veil"></div>
  <div class="body" id="sheetBody"></div>
</div>

<script id="qdata" type="application/json">__DATA__</script>
<script>
(function(){
"use strict";

// ─────────────────────────────────────────────────────────────────────
// Veri
// ─────────────────────────────────────────────────────────────────────
const DB = JSON.parse(document.getElementById('qdata').textContent);
const SUBJ = DB.s, QS = DB.q;
// soru dizisi: [0]=id [1]=dersIdx [2]=bölümIdx [3]=metin [4]=şıklar
//              [5]=tartışmalı [6]=tekrar [7]=üretilmiş [8]=şekilGerekli
const BY_ID = new Map(QS.map(q => [q[0], q]));
const KEYS = ['A','B','C','D','E'];
const DAY = 864e5;

// Aralıklı tekrar kutuları — doğru bildikçe soru ileriye atılır
const BOX_MS = [10*6e4, 1*DAY, 3*DAY, 7*DAY, 16*DAY, 35*DAY];
const LEECH = 4;          // bu kadar yanlıştan sonra "takıldığın soru"
const MASTER = 2;         // yanlış defterinden çıkmak için üst üste doğru

// ─────────────────────────────────────────────────────────────────────
// Kalıcı durum — tarayıcıda saklanır, dosyaya aktarılabilir
// ─────────────────────────────────────────────────────────────────────
const KEY = 'atpl.v2';
const blank = () => ({ v:2, c:{}, star:[], day:{}, pref:{} });
let S = blank();
try{
  const raw = localStorage.getItem(KEY);
  if (raw){ const p = JSON.parse(raw); if (p && p.v === 2) S = Object.assign(blank(), p); }
}catch(e){}
let saveT;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(() => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }, 250);
}
// kart: [kutu, vadeMs, görülme, yanlış, üstÜsteDoğru]
const card = id => S.c[id];
const stars = () => new Set(S.star);
const today = () => new Date().toISOString().slice(0,10);

function grade(id, ok){
  let k = S.c[id] || [0, 0, 0, 0, 0];
  k[2]++;
  if (ok){
    k[4]++;
    k[0] = Math.min(k[0] + 1, BOX_MS.length - 1);
  } else {
    k[3]++; k[4] = 0; k[0] = 0;
  }
  k[1] = Date.now() + BOX_MS[k[0]];
  S.c[id] = k;
  const d = S.day[today()] || [0,0];
  d[0]++; if (ok) d[1]++;
  S.day[today()] = d;
  save();
}

// ─────────────────────────────────────────────────────────────────────
// Filtreler
// ─────────────────────────────────────────────────────────────────────
const F = Object.assign({
  deck:'all', subj:[], sec:[], q:'',
  hideDup:true, gen:true, hideFig:true, hideFlag:false,
  count:20, mode:'study', order:'smart'
}, S.pref || {});
function savePref(){ S.pref = F; save(); }

const DECKS = [
  { k:'due',   cls:'due',   t:'Tekrar zamanı', d:'Vadesi gelen sorular' },
  { k:'wrong', cls:'wrong', t:'Yanlışlarım',   d:'Henüz oturmayanlar' },
  { k:'new',   cls:'new',   t:'Hiç görmedim',  d:'İlk kez çıkacak' },
  { k:'star',  cls:'star',  t:'Yıldızladıklarım', d:'Sonra bakılacaklar' },
];

// Deste dışındaki tüm süzgeçler — deste sayıları da bunun üstünden hesaplanır
function inScope(q){
  if (F.hideDup && q[6]) return false;
  if (!F.gen && q[7]) return false;
  if (F.hideFig && q[8]) return false;
  if (F.hideFlag && q[5]) return false;
  if (F.subj.length && !F.subj.includes(SUBJ[q[1]].c)) return false;
  if (F.sec.length && !F.sec.includes(SUBJ[q[1]].sec[q[2]][0])) return false;
  if (F.q){
    const n = F.q.toLocaleLowerCase('tr');
    if (!(q[0] + ' ' + q[3] + ' ' + q[4].join(' ')).toLocaleLowerCase('tr').includes(n)) return false;
  }
  return true;
}

function inDeck(q, deck){
  const k = card(q[0]), now = Date.now();
  switch (deck){
    case 'due':   return !!k && k[1] <= now;
    case 'wrong': return !!k && k[3] > 0 && k[4] < MASTER;
    case 'new':   return !k;
    case 'star':  return stars().has(q[0]);
    case 'leech': return !!k && k[3] >= LEECH;
    default:      return true;
  }
}

const scoped = () => QS.filter(inScope);
function deckCount(deck){ return scoped().filter(q => inDeck(q, deck)).length; }

function buildQueue(){
  let pool = scoped().filter(q => inDeck(q, F.deck));
  if (F.order === 'smart'){
    // Önce vadesi en çok geçmişler, sonra hiç görülmemişler, sonra rastgele
    pool = pool.map(q => {
      const k = card(q[0]);
      const over = k ? (Date.now() - k[1]) : -1;
      return { q, key: k ? -over : 1e15 + Math.random() };
    }).sort((a,b) => a.key - b.key).map(x => x.q);
  } else {
    for (let i = pool.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
  }
  return pool.slice(0, F.count);
}

// Şıklar her gösterimde karıştırılır (bankada doğru cevap hep ilk sıradadır)
function shuffleOpts(q){
  const idx = q[4].map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return idx;
}

let R = null;   // { list, i, order, picked, log, t0 }
let advT = null;

const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural = n => n.toLocaleString('tr-TR');

function start(){
  const list = buildQueue();
  if (!list.length) return;
  R = { list, i:0, order:null, picked:null, log:[], t0:Date.now() };
  nextQ();
}
function nextQ(){
  clearTimeout(advT);
  if (!R || R.i >= R.list.length) return done();
  R.order = shuffleOpts(R.list[R.i]);
  R.picked = null;
  draw();
  window.scrollTo({ top:0, behavior:'smooth' });
}
function pick(pos){
  if (!R || R.picked !== null) return;
  const q = R.list[R.i], oi = R.order[pos], ok = oi === 0;
  R.picked = pos;
  grade(q[0], ok);
  R.log.push({ id:q[0], ok, pick:oi });
  draw();
  clearTimeout(advT);
  if (F.mode === 'exam') advT = setTimeout(step, 150);
  else if (ok) advT = setTimeout(step, 580);
}
function step(){ clearTimeout(advT); if (R){ R.i++; nextQ(); } }

function draw(){

    let cls = 'opt', mark = '';
    if (shown){
      if (oi === 0){ cls += ' right'; mark = 'DOĞRU'; }

    } else if (pos === R.picked){ cls += ' sel'; }
    return '<button class="' + cls + '" data-p="' + pos + '"' + (R.picked !== null ? ' disabled' : '') +
      ' type="button"><span class="k">' + KEYS[pos] + '</span><span>' + esc(q[4][oi]) + '</span>' +
      (mark ? '<span class="m">' + mark + '</span>' : '') + '</button>';
  }).join('');

  let verdict = '';
  if (shown){
    const ok = R.order[R.picked] === 0;
    const nk = card(q[0]);
    verdict = ok
      ? '<div class="verdict ok"><span class="p">Doğru</span><span class="x">' +

      '<span class="num">' + R.list.length + '</span></span>' +

      '<div class="head"><span class="lbl">' + esc(s.c) + '</span>' +

        (q[8] ? '<span class="tag fig">şekil gerekli</span>' : '') +
        (q[7] ? '<span class="tag gen">üretilmiş</span>' : '') +
        (q[5] ? '<span class="tag flag">tartışmalı</span>' : '') +

    '</div>' +

      '<button class="go" id="next" type="button"' + (R.picked === null ? ' disabled' : '') + '>' +
        (last ? 'Bitir' : (shown && R.order[R.picked] !== 0 ? 'Anladım, devam' : 'Sonraki')) + '</button>' +
      (R.picked === null ? '<button class="go2" id="skip" type="button">Atla</button>' : '') +
      '<button class="go2" id="quit" type="button">Çık</button>' +

  el('quit').onclick = done;

    const i = S.star.indexOf(q[0]);

function whenAgain(k){
  if (!k) return '';
  const d = k[1] - Date.now();
  if (d < 60*6e4) return 'Tekrar: ' + Math.round(d/6e4) + ' dakika sonra';
  if (d < DAY) return 'Tekrar: ' + Math.round(d/36e5) + ' saat sonra';
  return 'Tekrar: ' + Math.round(d/DAY) + ' gün sonra';
}
function deckName(){
  const d = DECKS.find(x => x.k === F.deck);
  if (d) return d.t;
  if (F.deck === 'leech') return 'Takıldıklarım';
  return F.subj.length ? F.subj.join(', ') : 'Tüm dersler';
}

      '<b>Yükle</b>ye bas.</div>' +
    '<textarea id="bak" spellcheck="false" placeholder="Yedek metni buraya yapıştır…"></textarea>' +
    '<div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px">' +
      '<button class="tbtn" id="copy" type="button">Kopyala</button>' +
      '<button class="tbtn" id="load" type="button">Yükle</button>' +
      (window.self === window.top ? '<button class="tbtn" id="dl" type="button">Dosya indir</button>' +
        '<button class="tbtn" id="imp" type="button">Dosya seç</button>' : '') +
      '<button class="tbtn" id="wipe" type="button" style="color:var(--bad); border-color:var(--bad)">Sıfırla</button>' +
    '</div>' +
    '<div class="scopeline" id="bakMsg" style="margin-top:7px"></div>' +
    '<input type="file" id="impFile" accept="application/json" class="hidden">';

  el('sheet').classList.add('on');
  const gl = el('goLeech');
  if (gl) gl.onclick = () => { closeSheet(); F.deck = 'leech'; savePref(); start(); };
  const bak = el('bak');
  bak.value = JSON.stringify(S);
  const msg = m => { el('bakMsg').textContent = m;
    setTimeout(() => { const b = el('bakMsg'); if (b) b.textContent = ''; }, 3500); };

  el('copy').onclick = async () => {
    bak.select(); bak.setSelectionRange(0, 999999);
    let done = false;
    try{ await navigator.clipboard.writeText(bak.value); done = true; }
    catch(e){ try{ done = document.execCommand('copy'); }catch(e2){} }
    msg(done ? 'Kopyalandı. Diğer cihazda bu kutuya yapıştır.'
             : 'Kopyalanamadı — metni elle seçip kopyala.');
  };
  el('load').onclick = () => {
    const r = mergeProgress(bak.value);
    if (r === true){ closeSheet(); home(); }
    else msg(r);
  };
  if (el('dl')){
    el('dl').onclick = exportProgress;
    el('imp').onclick = () => el('impFile').click();
  }
  el('impFile').onchange = importProgress;
  let armed = false;
  el('wipe').onclick = () => {
    if (!armed){ armed = true; el('wipe').textContent = 'Emin misin? Tekrar bas';
      setTimeout(() => { armed = false; const w = el('wipe'); if (w) w.textContent = 'Sıfırla'; }, 4000);
      return; }
    S = blank(); save(); closeSheet(); home();
  };
}
function closeSheet(){ el('sheet').classList.remove('on'); }

function exportProgress(){
  const blob = new Blob([JSON.stringify(S)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'atpl-ilerleme-' + today() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
/** Yedek metnini mevcut ilerlemeyle birleştirir.
 *  Her soruda daha çok görülmüş kayıt kazanır — iki cihazda da çalıştıysan
 *  ikisinin de emeği korunur. Başarılıysa true, değilse hata metni döner. */
function mergeProgress(text){
  let p;
  try{ p = JSON.parse(text); }catch(e){ return 'Metin bozuk — tamamını kopyaladığından emin ol.'; }
  if (!p || p.v !== 2 || typeof p.c !== 'object') return 'Bu bir ATPL Çalışma yedeği değil.';
  let n = 0;
  Object.keys(p.c).forEach(id => {
    const a = S.c[id], b = p.c[id];
    if (Array.isArray(b) && b.length === 5 && (!a || b[2] > a[2])){ S.c[id] = b; n++; }
  });
  S.star = Array.from(new Set(S.star.concat(p.star || [])));
  Object.keys(p.day || {}).forEach(d => {
    const a = S.day[d] || [0,0], b = p.day[d];
    if (Array.isArray(b)) S.day[d] = [Math.max(a[0], b[0]), Math.max(a[1], b[1])];
  });
  save();
  return true;
}

function importProgress(e){
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const res = mergeProgress(r.result);
    if (res === true){ closeSheet(); home(); }
    else { const b = el('bakMsg'); if (b) b.textContent = res; }
  };
  r.readAsText(f);
  e.target.value = '';
}

// ─────────────────────────────────────────────────────────────────────
// Olaylar
// ─────────────────────────────────────────────────────────────────────
const savedTheme = (() => { try{ return localStorage.getItem('atpl.theme'); }catch(e){ return null; } })();
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
el('bTheme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const next = dark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('atpl.theme', next); }catch(e){}
};
el('bStats').onclick = openSheet;
el('veil').onclick = closeSheet;

document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea')) return;
  if (e.key === 'Escape'){ closeSheet(); return; }
  if (!R) return;
  if (e.key >= '1' && e.key <= '5'){
    const p = +e.key - 1;
    if (p < R.order.length && R.picked === null){ pick(p); e.preventDefault(); }
  } else if (e.key === 'Enter' || e.key === 'ArrowRight'){
    if (R.picked !== null){ step(); e.preventDefault(); }
  } else if (e.key === 's' || e.key === 'S'){
    const b = el('star'); if (b){ b.click(); e.preventDefault(); }
  }
});

home();
})();
</script>
